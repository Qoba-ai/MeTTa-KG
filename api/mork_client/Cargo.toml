[package]
name = "mork_client"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
futures-core = "0.3.32"
percent-encoding = "2.3.2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1.18"
