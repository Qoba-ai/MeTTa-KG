[package]
name = "csv_sexpr"
version = "0.1.0"
edition = "2021"
description = "Parse CSV, JSON, and RDF files into s-expressions with a highly customizable builder API"

[dependencies]
csv = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxrdf = "=0.3.3"
oxrdfio = "0.2.5"
